<h1 class="entry-title">နိုင်ငံခြားရေးဝန်ကြီးဌာနအတွက် အိတ်ဖွင့်တင်ဒါခေါ်ယူခြင်း</h1>
<time class="entry-date published" datetime="2026-09-04T13:11:15+06:30">စက်တင်ဘာ 4, 2026</time>
<div class="entry-content">
<p>နိုင်ငံခြားရေးဝန်ကြီးဌာနအတွက် ၂၀၂၆-၂၀၂၇ ခုနှစ်၊ ဘဏ္ဍာရေးနှစ်အတွင်း အောက်ပါပစ္စည်းများအား မြန်မာကျပ်ငွေဖြင့် ဝယ်ယူလိုပါသဖြင့် အိတ်ဖွင့်တင်ဒါတင်သွင်းရန် ဖိတ်ခေါ်အပ်ပါသည်။</p>
