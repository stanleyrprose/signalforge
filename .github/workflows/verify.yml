name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Registry contract
        run: python -m json.tool registry/Source-Registry-v1.yaml >/dev/null
      - name: Compile Python
        run: python -m compileall -q signalforge tests
      - name: Unit tests
        run: python -m unittest -v tests.test_acquisition_contract tests.test_contract tests.test_db tests.test_mpt tests.test_railways tests.test_iwt tests.test_moep tests.test_commerce tests.test_customs tests.test_customs_announcements tests.test_ird tests.test_dica tests.test_monpifer tests.test_doms tests.test_engine tests.test_source_health
      - name: Shell syntax
        run: |
          sh -n bin/signalforge
          sh -n deploy/deploy-signalforge-release.sh
